<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SB Tech Wall — Gestão de Obras</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><img src="assets/logo-escuro.png" alt="SB Tech Wall"><span class="sub">Gestão de Obras</span></div>
    <div class="side-lbl">Menu</div>
    <nav id="nav"></nav>
    <div class="side-foot">SB Tech Wall</div>
  </aside>
  <div class="content">
    <header class="topbar">
      <div class="backup">
        <span id="salvando" class="salvando"></span>
        <button onclick="exportar()" title="Salvar uma cópia de segurança dos dados">⬇ Salvar backup</button>
        <button onclick="document.getElementById('imp').click()" title="Carregar uma cópia de segurança">⬆ Restaurar backup</button>
        <input type="file" id="imp" accept=".json" hidden onchange="importar(this)">
        <div id="usuario" class="usuario"></div>
      </div>
    </header>
    <main id="main"></main>
  </div>
</div>
<div id="modal"></div>
<div id="login"></div>

<!-- Firebase (login com Google + banco de dados na nuvem) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<!-- A ordem importa: config e dados primeiro, nuvem.js e app.js por último. -->
<script src="js/firebase-config.js"></script>
<script src="js/config.js"></script>
<script src="js/dados.js"></script>
<script src="js/formatacao.js"></script>
<script src="js/navegacao.js"></script>
<script src="js/painel.js"></script>
<script src="js/obra.js"></script>
<script src="js/listas.js"></script>
<script src="js/formulario.js"></script>
<script src="js/proposta.js"></script>
<script src="js/importar.js"></script>
<script src="js/backup.js"></script>
<script src="js/nuvem.js"></script>
<script src="js/app.js"></script>
</body>
</html>
